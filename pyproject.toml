[project]
name = "flop-nexus"
version = "0.1.0"
description = "Agent discovery, coordination and reputation infrastructure for the FLOP ecosystem"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Pawan Upadhyay" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "cryptography>=43,<47",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
flop-nexus = "flop_nexus.cli:main"

[tool.ruff]
line-length = 100

target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
